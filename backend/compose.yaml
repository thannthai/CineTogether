# Local PostgreSQL for CineTogether.
# The project name is pinned so the existing container and the `cinetogether_postgres_data` volume are reused
# regardless of which directory this file lives in. Compose reads DB_PASSWORD from backend/.env automatically.
name: cinetogether

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinetogether
      POSTGRES_USER: cinetogether
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetogether -d cinetogether"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
